<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Product</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <a href="10-view-my-products.html" class="nav-back">‹ back to products</a>
    <h1 class="title">Edit Product</h1>
    <form action="10-view-my-products.html" method="get" enctype="multipart/form-data">
      <div class="field">
        <label class="label" for="name">Name</label>
        <input id="name" type="text" name="name" value="Montana Black 400ml" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="desc">Description</label>
        <textarea id="desc" name="desc">Premium high-pressure spray paint. Matte finish. 400ml can.</textarea>
      </div>

      <div class="field">
        <label class="label">Product Photo</label>
        <div class="product-photo">IMG</div>
      </div>
      <label class="btn" for="photo" style="cursor:pointer;">Change Product Photo</label>
      <input id="photo" type="file" name="photo" accept="image/*" style="display:none">

      <div class="row" style="margin-top: 12px;">
        <div class="field">
          <label class="label" for="cur">Currency</label>
          <select id="cur" name="currency">
            <option selected>XMR</option>
            <option>BTC</option>
            <option>USD</option>
            <option>EUR</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="price">Price</label>
          <input id="price" type="number" name="price" step="0.001" value="0.042" min="0">
        </div>
      </div>

      <div class="field">
        <label class="label" for="qty">Available Quantity</label>
        <input id="qty" type="number" name="qty" value="24" min="0" step="1">
      </div>

      <div style="height: 16px"></div>
      <button type="submit" class="btn btn--primary">Update</button>
    </form>
    <a href="10-view-my-products.html" class="btn">Back</a>
  </main>
</body>
</html>
