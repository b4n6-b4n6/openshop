<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <a href="07-view-my-shop.html" class="nav-back">‹ back to shop</a>
    <h1 class="title">Edit Shop</h1>
    <form action="07-view-my-shop.html" method="get">
      <div class="field">
        <label class="label" for="name">Shop Name</label>
        <input id="name" type="text" name="name" value="Spray King" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="desc">Shop Description</label>
        <textarea id="desc" name="desc">graffiti supplies · uncut cans · faceless brand · ships worldwide</textarea>
      </div>
      <div style="height: 16px"></div>
      <button type="submit" class="btn btn--primary">Update</button>
    </form>
    <a href="07-view-my-shop.html" class="btn">Back</a>
  </main>
</body>
</html>
