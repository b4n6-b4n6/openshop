<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Purchase Product</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <a href="13-view-products.html" class="nav-back">‹ back to products</a>

    <div class="product-photo">IMG</div>

    <h1 class="title">Montana Black 400ml</h1>
    <p style="font-size: 13px; color: var(--graphite-light);">
      Premium high-pressure spray paint. Matte finish. 400ml can.
    </p>

    <div class="card" style="padding: 0;">
      <div style="padding: 12px 16px;">
        <div class="kv"><span class="k">Price</span><span class="v price-tag">0.042 XMR</span></div>
        <div class="kv"><span class="k">Available Quantity</span><span class="v">24</span></div>
      </div>
    </div>

    <form action="15-view-order.html" method="get">
      <div class="field">
        <label class="label" for="qty">Purchase Quantity</label>
        <input id="qty" type="number" name="qty" min="1" max="24" value="1" step="1">
      </div>
      <div style="height: 16px"></div>
      <button type="submit" class="btn btn--primary">Purchase</button>
    </form>
    <a href="13-view-products.html" class="btn">Back</a>
  </main>
</body>
</html>
